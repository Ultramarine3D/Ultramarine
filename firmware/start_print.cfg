[gcode_macro PRINT_START]
gcode:
    # --- Parameters passed from slicer ---
    {% set BED_TEMP      = params.BED_TEMP|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|float %}
    {% set AREA_START    = params.AREA_START|default("15,15")|string %}
    {% set AREA_END      = params.AREA_END|default("365,365")|string %}

    # --- Parse print area ---
    {% set area_start_x = AREA_START.split(",")[0]|float %}
    {% set area_start_y = AREA_START.split(",")[1]|float %}
    {% set area_end_x   = AREA_END.split(",")[0]|float %}
    {% set area_end_y   = AREA_END.split(",")[1]|float %}

    # ---- 1. HEAT BED ----
    M140 S{BED_TEMP}
    SET_LED LED=mini12864 RED=1 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

    M104 S150                     # Preheat nozzle to no-drip temp

    # ---- 2. HOME SEQUENCE: X → Y → X → Z ----
    G28 X
    G28 Y
    G28 X
    G28 Z

    # ---- 3. WAIT FOR BED TO REACH TEMP ----
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 2}

    # ---- 4. Z TILT ----
    Z_TILT_ADJUST

    M109 S150                     # Hold nozzle at safe temp during probing

    # ---- 5. BED MESH (adaptive, 5x5, print area only) ----
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ALGORITHM=bicubic \
        MESH_MIN={area_start_x},{area_start_y} \
        MESH_MAX={area_end_x},{area_end_y} \
        PROBE_COUNT=5,5

    # ---- 6. HEAT NOZZLE TO PRINT TEMP ----
    G1 X175 Y10 Z10 F6000
    M109 S{EXTRUDER_TEMP}

    # ---- 7. PURGE LINES ----
    # Line 1 — THIN (wets nozzle, sets flow)
    G92 E0
    G1 X10  Y10  Z0.25 F3000
    G1 X10  Y340 Z0.25 E12 F1500
    G92 E0

    # Line 2 — THICK (wipes nozzle clean)
    G1 X12  Y340 Z0.30 F3000
    G1 X12  Y10  Z0.30 E20 F900
    G92 E0

    # ---- 8. NOZZLE WIPE ----
    # Replace coords with the location of your wipe pad/brush
    G1 Z5 F3000                                    # Lift before travel
    G1 X{WIPE_X_START} Y{WIPE_Y} F6000             # Travel to wipe start  -- PLACEHOLDER
    G1 Z{WIPE_Z} F600                              # Lower onto pad/brush  -- PLACEHOLDER
    G1 X{WIPE_X_END}   Y{WIPE_Y} F3000             # Wipe pass 1           -- PLACEHOLDER
    G1 X{WIPE_X_START} Y{WIPE_Y} F3000             # Wipe pass 2 (return)  -- PLACEHOLDER
    G1 X{WIPE_X_END}   Y{WIPE_Y} F3000             # Wipe pass 3           -- PLACEHOLDER
    G1 X{WIPE_X_START} Y{WIPE_Y} F3000             # Wipe pass 4 (return)  -- PLACEHOLDER
    G1 Z5 F3000                                    # Lift off pad

    # ---- 9. MOVE TO PRINT START ----
    G1 Z2.0 F3000
    G1 X{area_start_x} Y{area_start_y} F6000
    G1 Z0.2 F300
    M117 Printing...


# =====================================================
# PRINT_END MACRO — also shuts down correct heaters
# =====================================================

[gcode_macro PRINT_END]
gcode:
    G90
    {% set z = printer.toolhead.position.z|float %}
    {% if z < 200 %}
        G1 Z200 F3000
    {% elif z < 225 %}
        G1 Z225 F3000
    {% endif %}
    G1 X175 Y340 F6000
    M104 S0
    M140 S0
    M84
    BED_MESH_CLEAR
    SET_LED LED=mini12864 RED=0 GREEN=1 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=mini12864 RED=0 GREEN=1 BLUE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=mini12864 RED=0 GREEN=1 BLUE=0 INDEX=3
    M117 Print Complete